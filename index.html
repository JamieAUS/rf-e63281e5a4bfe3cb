/* Brainstorming / Mermaid Diagram Layout */
.mm-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);gap:20px;align-items:start}
.mm-canvas-wrap{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:540px;display:flex;flex-direction:column}
.mm-subbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.mm-viewport{width:100%;height:520px;overflow:auto;cursor:grab;display:flex;align-items:center;justify-content:center;padding:12px}
.mm-viewport:active{cursor:grabbing}
.mm-svg{width:100%;height:100%;min-width:680px;min-height:480px;transition:transform .15s ease;transform-origin:center center}
.mm-cluster{rx:14px;ry:14px;stroke-width:1.5;stroke-dasharray:5 4}
.mm-edge{fill:none;stroke:var(--muted);stroke-width:2;opacity:.72;transition:opacity .15s,stroke-width .15s}
.mm-edge.dashed{stroke-dasharray:6 5;stroke:var(--easy);opacity:.85}
.mm-edge.highlight{stroke:var(--easy);stroke-width:3.2;opacity:1}
.mm-node{cursor:pointer;transition:transform .12s ease}
.mm-node rect,.mm-node polygon{transition:stroke-width .12s,filter .12s}
.mm-node:hover rect,.mm-node:hover polygon{stroke-width:2.8;filter:drop-shadow(0 4px 10px rgba(37,99,235,.22))}
.mm-node.active rect,.mm-node.active polygon{stroke-width:3.5;filter:drop-shadow(0 5px 14px rgba(37,99,235,.35))}
.mm-inspector{position:sticky;top:16px;border-left:5px solid var(--easy)}
.mm-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--easy);margin-bottom:8px}
.mm-box{background:var(--soft);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:14.5px}
.mm-box b{display:block;margin-bottom:4px;color:var(--ink)}
.mm-code{background:var(--soft);padding:14px;border-radius:10px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;white-space:pre}
.comp-table th,.comp-table td{font-size:13.5px;padding:10px 8px}
/* Alternative Training Layout */
.alt-hero{background:linear-gradient(135deg,rgba(8,127,104,.11),rgba(37,99,235,.10));border:1px solid var(--line);border-left:6px solid var(--done);border-radius:14px;padding:22px 24px;margin-bottom:24px}
.alt-hero blockquote{margin:12px 0 0;padding:12px 16px;background:var(--paper);border-radius:10px;border-left:4px solid var(--easy);font-weight:700}
.alt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:24px}
.alt-card{border-top:5px solid var(--done);display:flex;flex-direction:column;gap:10px}
.alt-card.rank2{border-top-color:var(--easy)}
.alt-card.rank3{border-top-color:var(--long)}
.alt-rank{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--done);width:fit-content}
.alt-card.rank2 .alt-rank{color:var(--easy)}
.alt-card.rank3 .alt-rank{color:var(--long)}
.alt-cite{font-size:12.5px;color:var(--muted);margin-top:-4px}
.alt-subbox{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14.5px}

.alt-subbox.good{border-left:4px solid var(--done)}
.alt-subbox b{display:block;margin-bottom:4px;color:var(--ink)}
.alt-subbox ul{margin:6px 0 0;padding-left:18px}
.alt-subbox li{margin-bottom:8px}
.alt-combo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}
.alt-combo{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px}
.alt-combo h4{margin:0 0 8px;font-size:16.5px;color:var(--ink)}
.alt-pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--paper);border:1px solid var(--line);margin-right:6px;margin-bottom:4px}
.alt-cta{background:linear-gradient(135deg,var(--done),var(--easy));color:#fff!important;border:0!important;font-weight:700;box-shadow:0 2px 8px rgba(8,127,104,.22)}
.alt-cta:hover{opacity:.92}

.swim-cta:hover{opacity:.92}
.swim-hero{background:linear-gradient(135deg,rgba(2,132,199,.14),rgba(37,99,235,.10));border:1px solid var(--line);border-left:6px solid #0284C7;border-radius:14px;padding:20px 22px;margin-bottom:20px}
.swim-kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.swim-kpi{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.swim-kpi small{display:block;font-size:12px;color:var(--muted)}
.swim-kpi strong{display:block;font-size:19px;margin-top:2px;color:var(--ink)}
.swim-steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:20px}
.swim-step{border-top:5px solid #0284C7;display:flex;flex-direction:column;gap:10px}
.swim-step.s2{border-top-color:#D97706}
.swim-step.s3{border-top-color:#087F68}
.swim-step.s4{border-top-color:#7950B8}
.swim-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--soft);color:#0284C7;width:fit-content}
.swim-step.s2 .swim-tag{color:#D97706}
.swim-step.s3 .swim-tag{color:var(--done)}
.swim-step.s4 .swim-tag{color:var(--long)}
.swim-watch-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.swim-watch-card{border-radius:12px;padding:16px;border:2px solid var(--line)}
.swim-watch-card.rest{background:#111827;color:#F9FAFB;border-color:#0284C7}
.swim-watch-card.rest .meta,.swim-watch-card.rest small{color:#9CA3AF}
.swim-watch-card.active-scr{background:var(--paper);color:var(--ink)}
.watch-face{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;text-align:center}
.watch-cell{padding:10px 8px;border-radius:8px;border:1px solid rgba(148,163,184,.3);background:rgba(255,255,255,.06)}
.swim-watch-card.active-scr .watch-cell{background:var(--soft);border-color:var(--line)}
.watch-cell.full{grid-column:1 / -1}
.watch-cell span{display:block;font-size:11.5px;opacity:.8}
.watch-cell b{display:block;font-size:15px;margin-top:2px}

function duration(s){return esc(currentLang==='en'?s.replace(/분/g,' min').replace(/시간/g,' hr').replace(/이동/g,'moving'):s)}
function distanceLabel(s,w){return s.km===0?(s.duration.startsWith("총")?L("시간 기준·거리 목표 없음","time-based · no distance target"):L("휴식/보강","rest/strength")):(s.done||w.week===18?s.km+" km":s.km+" km · "+L("조건부 참고","conditional guide"))}
function weekOptions(){return DATA.weeks.map((w,i)=>`<option value="${i}" ${i===selectedWeekIdx?'selected':''}>${esc(trWeekLabel(w.label))} · ${w.start.slice(5)}–${w.end.slice(5)}</option>`).join('')}
function detail(s,id){let d=s.detail;if(!d)return '';return `<details data-open="${id}" ${opened.has(id)?'open':''} ontoggle="remember(this)"><summary>${L('운동 방법 펼치기','Workout instructions')}</summary><p>${esc(d.purpose)}</p><p><b>${L('야외','Outdoors')}</b><br>${esc(d.outdoor_guide)}</p><p><b>${L('트레드밀','Treadmill')}</b><br>${esc(d.treadmill_guide)}</p><p><b>${L('강도','Effort')}</b><br>${esc(d.hr_rpe_guide)}</p><ol>${(d.steps||[]).map(st=>`<li><b>${esc(st.stage)}</b><br>${esc(st.desc)}</li>`).join('')}</ol></details>`}
function remember(el){if(!el.isConnected)return;el.open?opened.add(el.dataset.open):opened.delete(el.dataset.open)}
function session(w,i,k,compact=false){let s=w[k];if(!s)return '';return `<article class="panel session ${k}"><div class="kind">${k==='core1'?'Core 1':k==='core2'?'Core 2':'Bonus'} · ${esc(s.date)}</div><h3>${esc(trTitle(s.title))}</h3><div class="work-meta"><span>${duration(s.duration)}</span><span>${distanceLabel(s,w)}</span></div><p class="meta">${esc(s.rpe)}</p><label class="check"><input type="checkbox" ${s.done?'checked':''} onchange="toggleDone(${i},'${k}')">${L('완료','Completed')}${k==='bonus1'?L(' · 선택 운동',' · Optional'):''}</label>${detail(s,`${i}-${k}`)}<button onclick="jump('${s.date}')">${L('달력에서 보기','View in calendar')}</button></article>`}
function renderWeekly(){let w=DATA.weeks[selectedWeekIdx],count=+w.core1.done + +w.core2.done;let next=keys.filter(k=>w[k]&&!w[k].done&&(w[k].km>0||w[k].duration.startsWith("총"))).sort((a,b)=>w[a].date.localeCompare(w[b].date))[0];$('weekly').innerHTML=`<div class="toolbar"><h2>${L('이번 주','This week')}</h2><div class="inline-controls"><select aria-label="${L('주 선택','Choose week')}" onchange="selectedWeekIdx=+this.value;renderWeekly()">${weekOptions()}</select><button class="swim-cta" onclick="showTab('swimming')">🏊 ${L('수영 고정 플랜 (1시간/풀부이)','Swimming Plan (1hr)')}</button><button class="alt-cta" onclick="showTab('alttraining')">🚴 ${L('쉬는 날 대체 훈련','Alternative Training')}</button><button onclick="showTab('mindmap')">🧠 ${L('스케치 마인드맵','Sketch Mindmap')}</button></div></div><div class="summary"><div class="panel"><div class="toolbar"><h3>Core 2</h3><span class="meta">${w.start.slice(5)}–${w.end.slice(5)}</span></div><div class="progress-count">${count} / 2</div><progress max="2" value="${count}" aria-label="Core progress"></progress><p>${count===2?L('이번 주 코어 완료!','Weekly core complete!'):L('코어 2회가 출석 목표. 통증으로 조정한 주는 실패가 아니야.','Two core sessions are the attendance goal. Adjusting for pain is not failure.')}</p><small>${L('보너스는 여유 있을 때만.','Bonus only when you have the energy.')}</small></div><div class="panel next"><div class="meta">${L('다음 운동','Next workout')}</div>${next?`<h3>${esc(trTitle(w[next].title))}</h3><p>${w[next].date} · ${duration(w[next].duration)} · ${distanceLabel(w[next],w)}</p><button onclick="jump('${w[next].date}')">${L('운동 확인','View workout')}</button>`:`<h3>${count===2?L('이번 주 코어 완료','All core sessions complete'):L('다음 코어는 회복 확인 후 재배치','Next core run after recovery check')}</h3>`}</div></div><div class="sessions">${keys.map(k=>session(w,selectedWeekIdx,k)).join('')}</div><details class="panel advice" data-open="advice-${selectedWeekIdx}" ontoggle="remember(this)" ${opened.has('advice-'+selectedWeekIdx)?'open':''}><summary>${L('이번 주 코치 메모','Weekly coach notes')}</summary><p>${esc(w.coach_tip)}</p><p>${esc(w.nutrition_tip)}</p><p>${esc(w.trainer_tip)}</p></details>`}
function toggleDone(i,k){DATA.weeks[i][k].done=!DATA.weeks[i][k].done;renderWeekly();renderCalendar();renderRoadmap()}
function events(date){let a=[];DATA.weeks.forEach((w,i)=>keys.forEach(k=>{if(w[k]?.date===date)a.push({s:w[k],k,i})}));return a}
function jump(date){selectedDate=date;selectedMonth=date.slice(0,7);let idx=DATA.weeks.findIndex(w=>w.start<=date&&w.end>=date);if(idx>=0)selectedWeekIdx=idx;renderCalendar();showTab('calendar');$('calendar').scrollIntoView({block:'start'})}
function shiftMonth(n){let d=new Date(selectedMonth+'-01T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+n);selectedMonth=d.toISOString().slice(0,7);selectedDate=selectedMonth+'-01';renderCalendar()}
function renderCalendar(){let [y,m]=selectedMonth.split('-').map(Number),offset=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7,days=new Date(Date.UTC(y,m,0)).getUTCDate();let cells='<div></div>'.repeat(offset);for(let n=1;n<=days;n++){let date=`${selectedMonth}-${String(n).padStart(2,'0')}`,ev=events(date),actual=DATA.recent_activities.filter(a=>a.date===date);cells+=`<button class="day ${date===today?'today':''}" aria-pressed="${date===selectedDate}" aria-label="${date}, ${ev.map(e=>e.k).join(', ')}${actual.length?L(', 실제 기록 있음',', recorded activity'):''}" onclick="selectedDate='${date}';renderCalendar()"><span>${n}</span><span class="dots">${ev.map(e=>`<span class="dot ${e.k}"></span>`).join('')}${actual.length?'<span class="dot actual"></span>':''}</span><span class="day-caption">${ev.map(e=>e.k==='bonus1'?'Bonus':e.k==='core1'?'Core 1':'Core 2').join(' / ')}</span></button>`}
$('calendar').innerHTML=`<div class="toolbar"><h2>${L('훈련 달력','Training calendar')}</h2><div class="inline-controls"><button aria-label="${L('이전 달','Previous month')}" onclick="shiftMonth(-1)">‹</button><input type="month" class="date-select" aria-label="${L('월 선택','Choose month')}" value="${selectedMonth}" onchange="if(this.value){selectedMonth=this.value;selectedDate=selectedMonth+'-01';renderCalendar()}"><button aria-label="${L('다음 달','Next month')}" onclick="shiftMonth(1)">›</button></div></div><div class="calendar-layout"><div class="panel"><div class="calendar">${L(['월','화','수','목','금','토','일'],['M','T','W','T','F','S','S']).map(d=>`<div class="weekday">${d}</div>`).join('')}${cells}</div><div class="legend"><span><i class="dot"></i> Core 1</span><span><i class="dot core2"></i> Core 2</span><span><i class="dot bonus1"></i> Bonus</span><span><i class="dot actual"></i> ${L('실제 기록','Recorded')}</span></div></div><div><h3>${selectedDate}</h3>${events(selectedDate).map(e=>session(DATA.weeks[e.i],e.i,e.k)).join('')||`<p class="empty">${L('계획된 러닝이 없는 날','No run scheduled')}</p>`}${DATA.recent_activities.filter(a=>a.date===selectedDate).map(a=>`<article class="panel"><h3>${L('실제 기록','Recorded activity')}</h3><a href="${esc(a.url)}">${esc(a.name)}</a><p>${a.distance_km} km · ${Math.round(a.time_seconds/60)} ${L('분','min')}</p><p class="meta">${esc(a.avg_hr)} · ${esc(a.avg_pace)}</p></article>`).join('')}</div></div>`}
function renderRoadmap(){let heads=[L('주차','Week'),'Core 1','Core 2','Bonus'];$('roadmap').innerHTML=`<h2 class="screen-title">${L('18주 조건부 계획','18-week conditional plan')}</h2><div class="desktop-table panel"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${DATA.weeks.map((w,i)=>`<tr><td>${esc(trWeekLabel(w.label))}<p>${w.start.slice(5)}–${w.end.slice(5)}</p>${w.is_deload?L('회복 주','Deload'):''}</td>${keys.map(k=>`<td><button onclick="jump('${w[k].date}')">${esc(trTitle(w[k].title))}</button><p>${duration(w[k].duration)} · ${distanceLabel(w[k],w)} ${w[k].done?'✓':''}</p>${detail(w[k],'plan-'+i+k)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="mobile-list">${DATA.weeks.map((w,i)=>`<details class="panel list-item" data-open="plan-${i}" ontoggle="remember(this)" ${opened.has('plan-'+i)?'open':''}><summary>${esc(trWeekLabel(w.label))} · ${w.week===18?L('대회','Race'):L('롱런 참고','Long run guide')} ${distanceLabel(w.core2,w)}<div class="meta">${w.start.slice(5)}–${w.end.slice(5)} · ${esc(trPhase(w.phase_name))}</div></summary>${keys.map(k=>session(w,i,k)).join('')}</details>`).join('')}</div>`}
function renderCheckpoints(){let rows=DATA.weeks.filter(w=>w.checkpoint);$('checkpoints').innerHTML=`<h2>${L('점검과 조정','Checkpoints')}</h2>${rows.map(w=>{let c=w.checkpoint;return `<details class="panel list-item" data-open="cp-${c.cp_num}" ontoggle="remember(this)" ${opened.has('cp-'+c.cp_num)?'open':''}><summary>CP ${c.cp_num} · ${c.date}<div>${esc(c.title)}</div></summary><h3>${L('확인 방법','Check')}</h3><p>${esc(c.test_method)}</p><h3>${L('조정 기준','Adjustment')}</h3><p>${esc(c.adjust_rule)}</p><button onclick="jump('${c.date}')">${L('해당 운동 보기','View workout')}</button></details>`}).join('')}`}
function renderMonthly(){let labels=[L('월','Month'),L('실제 / 참고 거리','Actual / guide distance'),L('러닝 일수','Running days'),L('최장 거리 / 참고','Longest / guide')];let cells=m=>[m.month,`${m.actual_km} / ${m.core_target_km} km`,`${m.actual_days} / ${m.core_target_days}`,`${m.actual_longest_km} / ${m.target_longest_km} km`];$('monthly').innerHTML=`<h2>${L('월별 통계','Monthly statistics')}</h2><p class="meta">${L('실제 기록은 Garmin 자료 기준입니다. 앞으로의 거리는 조건부 참고치이며 완료 체크는 이 화면만 바꿉니다.','Actual totals come from Garmin. Future distances are conditional guides; checkboxes change this view only.')}</p><div class="panel desktop-table"><table><thead><tr>${labels.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${DATA.monthly_summary.map(m=>`<tr>${cells(m).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="mobile-list">${DATA.monthly_summary.map(m=>`<details class="panel list-item"><summary>${m.month}<div class="meta">${m.actual_km} / ${m.core_target_km} km</div></summary>${cells(m).slice(1).map((v,i)=>`<p>${labels[i+1]}<br><b>${v}</b></p>`).join('')}</details>`).join('')}</div>`}

function setMmFilter(f){
  mmFilter=f;
  const firstByGroup={all:'g_q',goal:'g_q',running:'r_mech',limit:'l_root',tools:'t_info'};
  if(f!=='all'&&MM_NODES[mmSelectedNode]?.group!==f)mmSelectedNode=firstByGroup[f]||'g_q';
  renderMindmap();
}
function selectMmNode(id){mmSelectedNode=id;renderMindmap()}
function setMmZoom(z){mmZoom=Math.max(0.7,Math.min(1.6,Math.round(z*10)/10));const svg=document.getElementById('mm-svg-el');if(svg)svg.style.transform=`scale(${mmZoom})`;const lbl=document.getElementById('mm-zoom-lbl');if(lbl)lbl.textContent=Math.round(mmZoom*100)+'%'}

function buildMindmapSvg(){
  const colors={
    goal:{stroke:'#2563EB',fill:'rgba(37,99,235,0.08)',badge:'Sketch 1 · GOAL'},
    running:{stroke:'#087F68',fill:'rgba(8,127,104,0.08)',badge:'Sketch 4 · RUNNING'},
    limit:{stroke:'#DC2626',fill:'rgba(220,38,38,0.08)',badge:'Sketch 3 · LIMITATIONS'},
    tools:{stroke:'#7950B8',fill:'rgba(121,80,184,0.08)',badge:'Sketch 2 · TOOLS'}
  };
  const clusters=[
    {group:'goal',x:12,y:16,w:382,h:460,title:'Sketch 1 · GOAL (목표 & 제1원칙)'},
    {group:'running',x:412,y:16,w:468,h:284,title:'Sketch 4 · RUNNING (생리 주기 · 운동 사슬 · 타깃)'},
    {group:'limit',x:412,y:310,w:468,h:205,title:'Sketch 3 · LIMITATIONS (What is Primary Factor?)'},
    {group:'tools',x:12,y:490,w:520,h:128,title:'Sketch 2 · TOOLS (Data: Watch→Information & Gear)'}
  ].filter(c=>mmFilter==='all'||mmFilter===c.group);

  const visibleNodes=Object.values(MM_NODES).filter(n=>mmFilter==='all'||n.group===mmFilter);
  const visibleIds=new Set(visibleNodes.map(n=>n.id));
  const visibleEdges=MM_EDGES.filter(e=>visibleIds.has(e.from)&&visibleIds.has(e.to)&&(mmFilter==='all'||e.group===mmFilter));

  let viewBox='0 0 895 632';
  if(mmFilter==='goal')viewBox='0 0 410 490';
  else if(mmFilter==='running')viewBox='400 5 490 305';
  else if(mmFilter==='limit')viewBox='400 300 490 225';
  else if(mmFilter==='tools')viewBox='0 480 545 150';

  const clusterSvg=clusters.map(c=>{
    const col=colors[c.group];
    return `<g><rect class="mm-cluster" x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" fill="${col.fill}" stroke="${col.stroke}"/><text x="${c.x+14}" y="${c.y+22}" fill="${col.stroke}" font-size="12.5" font-weight="750">${esc(c.title)}</text></g>`;
  }).join('');

  const edgeSvg=visibleEdges.map(e=>{
    const a=MM_NODES[e.from],b=MM_NODES[e.to];
    const isHi=mmSelectedNode===e.from||mmSelectedNode===e.to;
    const dy=b.y-a.y, dx=b.x-a.x;
    let x1=a.x, y1=a.y+(dy>=0?a.h/2:-a.h/2), x2=b.x, y2=b.y+(dy>=0?-b.h/2:b.h/2);
    if(Math.abs(dy)<25){x1=a.x+(dx>=0?a.w/2:-a.w/2);y1=a.y;x2=b.x+(dx>=0?-b.w/2:b.w/2);y2=b.y;}
    const cy1=y1+(y2-y1)*0.45, cy2=y2-(y2-y1)*0.45;
    const d=`M ${x1} ${y1} C ${x1} ${cy1}, ${x2} ${cy2}, ${x2} ${y2}`;
    return `<path class="mm-edge ${e.dashed?'dashed':''} ${isHi?'highlight':''}" d="${d}" marker-end="url(#mm-arrow)"/>`;
  }).join('');

  const nodeSvg=visibleNodes.map(n=>{
    const col=colors[n.group], isAct=mmSelectedNode===n.id;
    const x0=n.x-n.w/2, y0=n.y-n.h/2;
    let shape='';
    if(n.shape==='diamond'){
      const pts=`${n.x},${y0-4} ${x0+n.w+8},${n.y} ${n.x},${y0+n.h+4} ${x0-8},${n.y}`;
      shape=`<polygon points="${pts}" fill="var(--paper)" stroke="${col.stroke}" stroke-width="${isAct?3.5:2}"/>`;
    }else{
      shape=`<rect x="${x0}" y="${y0}" width="${n.w}" height="${n.h}" rx="9" ry="9" fill="var(--paper)" stroke="${col.stroke}" stroke-width="${isAct?3.5:1.8}"/>`;
    }
    return `<g class="mm-node ${isAct?'active':''}" onclick="selectMmNode('${n.id}')" role="button" tabindex="0" aria-label="${esc(n.label)}">${shape}<text x="${n.x}" y="${n.y-(n.sub?4:-4)}" text-anchor="middle" fill="var(--ink)" font-size="12" font-weight="750">${esc(n.label)}</text>${n.sub?`<text x="${n.x}" y="${n.y+11}" text-anchor="middle" fill="var(--muted)" font-size="10.2">${esc(n.sub)}</text>`:''}</g>`;
  }).join('');

  return `<svg id="mm-svg-el" class="mm-svg" viewBox="${viewBox}" style="transform:scale(${mmZoom})" xmlns="http://www.w3.org/2000/svg"><defs><marker id="mm-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#526574"/></marker></defs>${clusterSvg}${edgeSvg}${nodeSvg}</svg>`;
}

            <li><b>① 왼쪽 슬개골 위쪽 압박감 해결사 — ‘벽 기대고 버티기 (Isometric Wall Sit)’ 또는 ‘스패니시 스쿼트’</b>:<br>무릎을 굽혔다 폈다 하는 레그 익스텐션 대신, 벽에 등을 기대고 무릎을 약 <code>45~60°</code>만 살짝 구부린 채로 <b><code>30~45초간 가만히 버티기 × 3~4세트</code></b>. 등척성 수축(Isometric hold)은 슬개골 위아래 힘줄(대퇴사두건·슬개건)에 <b>진통 효과(analgesic effect)</b>를 주면서 힘줄 강성만 딱 키워준다!</li>
            <li><b>② 발 바깥쪽(Cuboid) &amp; 발목 스프링 강화 — ‘느린 카프레이즈 (Slow Calf Raise)’</b>:<br>통통 반동 주지 말고 <b><code>3초 올라가고 - 1초 멈추고 - 3초 버티며 내려오기 × 12회 × 3세트</code></b> (무릎 펴서 비복근 / 무릎 살짝 구부려서 가자미근).</li>
            <li><b>③ 미드스탠스 무릎 흔들림 방지 — ‘중둔근(Glute Medius) &amp; 힙 브릿지’</b>:<br>밴드 끼고 옆으로 걷기(Monster walk / Crab walk) 또는 힙 어브덕션(Hip abduction) 머신 가볍게 3세트. 골반이 위에서 딱 잡아주면 미드스탠스 때 왼쪽 슬개골이 눌리는 힘이 확 줄어든다.</li>
          </ul>
        </div>
      </article>
    </div>

    <!-- Weekly Golden Combination -->
    <div class="panel">
      <h3>🗓️ Jamie의 주간 황금 조합 — ‘주 2~3회 러닝 + 짐(Gym) 크로스트레이닝’ 공식</h3>
      <p class="meta">일주일에 달리는 날은 2~3일이어도, <b>심폐 유산소 엔진은 주 4~5일 내내 돌아가면서 관절 부상 위험은 제로(0)</b>로 만드는 실전 스케줄입니다.</p>
      <div class="alt-combo-grid">
        <div class="alt-combo" style="border-top:4px solid var(--easy)">
          <span class="alt-pill">주 2회 필수 코어 (예: 월·수 또는 화·일)</span>
          <h4>🏃 러닝하는 날 (Core 1 &amp; Core 2)</h4>
          <p><b>야외 러닝 (<code>160 spm</code> 비트) 집중!</b></p>
          <ul>
            <li>워밍업 첫걸음(0분 00초)부터 <code>160 spm</code> 비트를 켜고 <b>좁은 종종걸음 보폭</b>으로 시작해 초반 cuboid 자극과 전환 마찰을 동시에 차단한다.</li>
            <li>본운동에서는 <code>160 spm</code> 리듬은 그대로 둔 채 보폭만 자연스럽게 넓혀 Zone 2~3 유산소 항정 상태로 순항한다.</li>
            <li>1km 랩 알림마다 어깨를 귀에서 멀리 툭 떨어뜨려 목(C6) 긴장을 리셋한다.</li>
          </ul>
        </div>

        <div class="alt-combo" style="border-top:4px solid var(--done)">
          <span class="alt-pill">러닝 쉬는 날 짐(Gym) 옵션 1</span>
          <h4>💪 조합 A: 상체 웨이트 날 + 유산소 보너스</h4>
          <p><b>상체 웨이트 30~40분 + 무충격 유산소 20~30분</b></p>
          <ul>
            <li>상체 웨이트(가슴·등·어깨·팔)를 평소대로 수행한다.</li>
            <li>마무리로 <b>실내 자전거(가벼운 기어, <code>80~90 RPM</code>) 또는 일립티컬 <code>20~30분</code> (<code>HR 125~138 bpm</code>)</b>을 탄다!</li>
            <li>👉 <b>C6 목 보호 포인트</b>: 상체 웨이트나 자전거를 탈 때 고개를 푹 숙여서 휴대폰을 보지 말고, <b>시선을 정면에 두어 경추 6번(C6) 부위 긴장을 예방</b>한다.</li>
          </ul>
        </div>

        <div class="alt-combo" style="border-top:4px solid var(--long)">
          <span class="alt-pill">러닝 쉬는 날 짐(Gym) 옵션 2</span>
          <h4>🛡️ 조합 B: 하체 힘줄 방탄 + 리커버리 바이크 날</h4>
          <p><b>힘줄 방탄 3종 20분 + 실내 자전거 20분</b></p>
          <ul>
            <li>무릎 앞쪽을 피로하게 만드는 무거운 고반복 레그 익스텐션은 과감히 뺀다.</li>
            <li><b>① 벽 스쿼트 버티기(Wall sit, 30~45초) 3세트 + ② 중둔근/힙 어브덕션 3세트 + ③ 슬로우 카프레이즈(3초-1초-3초) 3세트</b>를 딱 20분만 수행한다.</li>
            <li>직후 <b>실내 자전거를 가벼운 기어(<code>80~90 RPM</code>)로 20분</b> 돌려 하체 혈류를 펌프질하고 깔끔하게 마무리한다!</li>
          </ul>
        </div>
      </div>
    </div>
  `;
}

function showTab(tab){activeTab=tab;document.body.dataset.view=tab;['weekly','calendar','roadmap','checkpoints','monthly','swimming','alttraining','mindmap'].forEach(id=>{$(id).hidden=id!==tab});renderNav()}
function renderNav(){let ids=['weekly','calendar','roadmap','checkpoints','monthly','swimming','alttraining','mindmap'],names=L(['이번 주','달력','전체 계획','점검','통계','🏊 수영','🚴 대체','🧠 맵'],['Week','Cal','Plan','Checks','Stats','🏊 Swim','🚴 Cross','🧠 Map']);$('nav').innerHTML=ids.map((id,i)=>`<button onclick="showTab('${id}')" aria-controls="${id}" ${activeTab===id?'aria-current="page"':''}>${names[i]}</button>`).join('')}
function setLanguage(lang){currentLang=lang;try{localStorage.setItem('jamie_running_coach_lang',lang)}catch(e){}renderAll()}
function renderAll(){document.documentElement.lang=currentLang;$('ko').setAttribute('aria-pressed',currentLang==='ko');$('en').setAttribute('aria-pressed',currentLang==='en');renderWeekly();renderCalendar();renderRoadmap();renderCheckpoints();renderMonthly();renderSwimming();renderAltTraining();renderMindmap();showTab(activeTab);$('footer').innerHTML=`${L('자료 갱신','Data updated')}: ${DATA.updated_on} · ${L('오늘 (Sydney)','Today (Sydney)')}: ${today}<br>${L('완료 체크는 현재 열린 화면에만 적용됩니다. 상세 코칭 원문은 한국어로 유지됩니다.','Completion checks apply to this open page. Original coaching instructions remain in Korean.')}`}
renderAll();
